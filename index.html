<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b1320"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>PP Team Calc</title><link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<style>
:root{color-scheme:dark;--bg:#0b1320;--surface:#142238;--card:#1a2c44;--border:#2a425b;--muted:#99b1c6;--accent:#4cd5d0;--text:#eff9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
header{position:sticky;top:0;z-index:2;background:#0b1320ed;backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}.wrap{max-width:1050px;margin:auto;padding:18px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:22px;letter-spacing:.2px}.logo{color:var(--accent)}.sub,.hint{color:var(--muted);font-size:12px}.pill{border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:12px;color:var(--muted)}.box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin:18px 0}h2{font-size:16px;margin:0 0 14px}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}select,input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px 10px;font:inherit;outline:none}select:focus,input:focus{border-color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}button{background:var(--accent);color:#0b1320;border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#263d53;color:var(--text)}button:disabled{opacity:.5;cursor:wait}.rankhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px}.num{color:var(--accent);font-size:18px;font-weight:800;min-width:30px}.desc{flex:1;min-width:0}.name{font-size:15px;font-weight:700;overflow-wrap:anywhere}.moves{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.dps{text-align:right;white-space:nowrap;font-weight:800;font-size:19px}.dps small{display:block;font-size:10px;color:var(--muted)}.note{border-left:3px solid #efbc6c;padding:8px 12px;font-size:12px;color:#d6dfe9}.empty{padding:45px 15px;text-align:center;color:var(--muted)}#status{font-size:12px;color:var(--muted)}.foot{color:var(--muted);font-size:12px;margin-bottom:40px}
@media(max-width:700px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.list{grid-template-columns:1fr}.wrap{padding:14px}.box{padding:14px}.dps{font-size:18px}}@media(max-width:380px){.fields{grid-template-columns:1fr 1fr}.item{padding:10px}}
</style></head><body>
<header><div class="wrap top"><div><h1><span class="logo">⚡</span> PP TEAM CALC</h1><div class="sub">Pokémon GO Raid Team Power</div></div><span class="pill" id="status">연결 대기</span></div></header>
<main class="wrap">
<section class="box"><h2>레이드 계산 조건</h2><div class="fields">
<div class="field"><label for="boss">레이드 보스</label><select id="boss"></select></div>
<div class="field"><label for="weather">날씨</label><select id="weather"></select></div>
<div class="field"><label for="mega">메가 · 원시 보너스</label><select id="mega"></select></div>
<div class="field"><label for="friend">우정 보너스</label><select id="friend"></select></div>
<div class="field"><label for="sword">거수참 보너스</label><select id="sword"></select></div>
<div class="field"><label for="team">팀 인원</label><select id="team"></select></div>
<div class="field"><label for="max">슈퍼맥스 보너스</label><select id="max"></select></div>
<div class="field"><label for="maxPokemon">팀파워 대상 포켓몬</label><select id="maxPokemon"></select></div>
</div><div class="actions"><button id="calculate" disabled>계산하기</button><button id="reset" class="secondary">초기 설정</button><button id="reload" class="secondary">데이터 새로고침</button></div></section>
<div class="note">시트의 자체 계산 방식을 이식한 시험 버전입니다. 원본의 미구현 개체, 1차징 패널티 미적용, 피해 에너지·실신 에너지 미반영 등 한계도 동일합니다. 수치 검증 후 공개하세요.</div>
<section class="box"><div class="rankhead"><h2>공격 DPS 순위 <span id="count" class="hint"></span></h2><div style="max-width:180px;width:45%"><input id="search" type="search" placeholder="포켓몬 검색" aria-label="포켓몬 검색"/></div></div><div id="results" class="list"><div class="empty">계산 데이터를 불러오는 중입니다.</div></div></section>
<div class="foot">계산은 각 사용자 브라우저에서 독립 실행됩니다. 다른 사용자의 설정이나 원본 시트 셀은 변경되지 않습니다. Pokémon GO와 비공식 팬 프로젝트이며 개발사와 무관합니다.</div>
</main><script src="config.js"></script><script>
'use strict';
const $ = id => document.getElementById(id);
const ids = ['boss','weather','mega','friend','sword','team','max','maxPokemon'];
let data, ranks=[], lastDefaults={}, loadBusy=false;
const n = x => { if (typeof x==='number') return x; if(x==null || x==='')return NaN;const t=String(x).replace(/[(),\s]/g,'');return Number(t);};
const lookupTable=(table,key,column)=>{
 const header=(table[0]||[]).map(String), idx=header.indexOf(String(column));
 if(idx<0)return NaN;
 const row=table.slice(1).find(r=>String(r[0])===String(key));
 return row?n(row[idx]):NaN;
};
const dedup = arr => Array.from(new Set(arr.map(String).filter(Boolean)));
function populate(id,options,preferred){const e=$(id);e.replaceChildren();for(const val of dedup(options)){const op=document.createElement('option');op.value=val;op.textContent=val;e.append(op);}if(preferred!=null && [...e.options].some(o=>o.value===String(preferred)))e.value=String(preferred);}
function initOptions(){
 const def=data.defaults||{};
 const bossNames=dedup(data.bosses);
 const mons=dedup(data.pokemon.map(p=>p[0]));
 populate('boss',bossNames,def.boss);
 populate('weather',data.weather.slice(1).map(r=>r[0]),def.weather);
 populate('mega',data.mega.slice(1).map(r=>r[0]),def.mega);
 populate('friend',['베프','일반'],def.friend);
 populate('sword',['거수참','일반'],def.sword);
 populate('team',[1,2,3,4,5],def.team);
 populate('max',['슈퍼맥스','하이레벨'],def.max);
 populate('maxPokemon',mons,def.maxPokemon);
 lastDefaults=Object.fromEntries(ids.map(id=>[id,$(id).value]));
 $('calculate').disabled=false;calculate();
}
function computeRow(p,boss,settings,movesByName,bossByName,cpByLevel,selectedTarget) {
 const name=String(p[0]), type1=String(p[1]||''),type2=String(p[2]||'');
 const level=n(p[3]),attack=n(p[4]),baseAtk=n(p[6]),fast=String(p[9]||''),fastType=String(p[10]||''),charged=String(p[14]||''),chargedType=String(p[15]||'');
 const moveF=movesByName.get(fast),moveC=movesByName.get(charged);
 const fpower=moveF?n(moveF[1]):NaN, fenergy=moveF?n(moveF[2]):NaN, ftime=moveF?n(moveF[3]):NaN;
 const cpower=(moveC?n(moveC[1]):NaN) * (p[19]===1 || String(p[19])==='1' ? (settings.max==='슈퍼맥스'?1.3:1.2):1);
 const cenergy=moveC?Math.abs(n(moveC[2])):NaN,ctime=moveC?n(moveC[3]):NaN;
 const bossRow=bossByName.get(boss),defense=bossRow?n(bossRow[1]):NaN;
 const cp=cpByLevel.get(String(level));const atk=Number.isFinite(cp)?attack*cp:NaN;
 if(!Number.isFinite(fpower*cpower*fenergy*cenergy*ftime*ctime*atk*defense) || fenergy<=0 || cenergy<=0 || ftime<=0 || ctime<=0)return null;
 const fastN=cenergy/fenergy, period=fastN*ftime+ctime;
 const shadow=name.includes('그림자')?1.2:1;
 const common=shadow*(settings.sword==='거수참'?1.2:1)*(settings.friend==='베프'?1.1:1);
 const teamCount=Number(settings.team);
 const maxFast=teamCount>1?360/(20*(teamCount-1)):Infinity;
 const teamBuff=teamCount>1?Math.min(fastN,maxFast)/maxFast:0;
 // 원본 data_dps!V열은 팀 인원 > 0 일 때 모든 개체에서 1입니다.
 // F3 포켓몬 선택은 DPS가 아닌 상대 비율(F열)의 분모에만 쓰입니다.
 const w=teamBuff;
 const calcDamage=(power,moveType,chargedFlag)=>{
   const stab=(moveType===type1 || moveType===type2)?1.2:1;
   const weather=lookupTable(data.weather,settings.weather,moveType);
   const mega=lookupTable(data.mega,settings.mega,moveType);
   const e1=lookupTable(data.effectiveness,moveType,bossRow&&bossRow[3]);
   const e2=bossRow&&bossRow[4]?lookupTable(data.effectiveness,moveType,bossRow[4]):1;
   const multiplier=stab*common*weather*mega*e1*e2;
   if(!Number.isFinite(multiplier))return NaN;
   return Math.floor(0.5*power*atk/((defense+15)*0.7903)*multiplier)+1;
 };
 const fd=calcDamage(fpower,fastType,false),cd=calcDamage(cpower*(1+w),chargedType,true);
 if(!Number.isFinite(fd+cd) || period<=0)return null;
 return {name,fast,charged,dps:(fd*fastN+cd)/period};
}
function calculate(){if(!data)return;const settings=Object.fromEntries(ids.map(id=>[id,$(id).value]));
 const bossByName=new Map(data.raidBosses.map(row=>[String(row[0]),row]));
 const movesByName=new Map(data.moves.map(row=>[String(row[0]),row]));
 const cpByLevel=new Map(data.cp.map(row=>[String(n(row[0])),n(row[1])]));
 const list=[];let skipped=0;
 for(const row of data.pokemon){const val=computeRow(row,settings.boss,settings,movesByName,bossByName,cpByLevel,settings.maxPokemon); if(val&&Number.isFinite(val.dps))list.push(val);else skipped++;}
 const reference=list.find(x=>x.name===settings.maxPokemon);
 const base=reference?.dps||NaN;
 ranks=list.sort((a,b)=>b.dps-a.dps).slice(0,100).map(x=>({...x,relative:Number.isFinite(base)?100*x.dps/base:NaN}));
 $('status').textContent='계산 완료';render();
 if(skipped)console.warn('계산값 확인 필요:',skipped,'개 포켓몬 조합');
}
function render(){const q=$('search').value.trim().toLowerCase();const rows=ranks.filter(x=>(x.name+' '+x.fast+' '+x.charged).toLowerCase().includes(q));$('count').textContent=rows.length+'개';const root=$('results');root.replaceChildren();if(!rows.length){const t=document.createElement('div');t.className='empty';t.textContent='검색 결과가 없습니다.';root.append(t);return;}
 for(const x of rows){const item=document.createElement('article');item.className='item';const a=document.createElement('div');a.className='num';a.textContent=String(ranks.indexOf(x)+1);const b=document.createElement('div');b.className='desc';const name=document.createElement('div');name.className='name';name.textContent=x.name;const moves=document.createElement('div');moves.className='moves';moves.textContent=x.fast+' / '+x.charged;b.append(name,moves);const c=document.createElement('div');c.className='dps';c.textContent=x.dps.toFixed(2);const small=document.createElement('small');small.textContent='DPS'+(Number.isFinite(x.relative)?' · 기준 '+x.relative.toFixed(0)+'%':'');c.append(small);item.append(a,b,c);root.append(item);}
}
function load(){if(loadBusy)return;loadBusy=true;$('calculate').disabled=true;$('status').textContent='데이터 불러오는 중';const url=String(window.PP_API_URL||'');if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url)){$('status').textContent='API 연결 설정 필요';$('results').textContent='config.js 파일에 배포된 Apps Script 웹앱 URL을 입력하세요.';loadBusy=false;return;}
 const cb='ppCalcCallback'+Date.now();let done=false;const script=document.createElement('script');const timeout=setTimeout(()=>finish(new Error('연결 시간 초과')),20000);
 function finish(err,payload){if(done)return;done=true;clearTimeout(timeout);delete window[cb];script.remove();loadBusy=false;if(err||payload?.error){$('status').textContent='연결 오류';$('results').textContent=err?.message||payload.error;return;}data=payload;initOptions();}
 window[cb]=payload=>finish(null,payload);
 script.onerror=()=>finish(new Error('API 연결 실패: 배포 권한 또는 URL을 확인하세요.'));
 script.src=url+(url.includes('?')?'&':'?')+'callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.append(script);
}
$('calculate').addEventListener('click',calculate);$('reload').addEventListener('click',load);$('search').addEventListener('input',render);
$('reset').addEventListener('click',()=>{for(const [id,v]of Object.entries(lastDefaults))$(id).value=v;calculate();});
for(const id of ids)$(id).addEventListener('change',calculate);
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();
</script></body></html>
